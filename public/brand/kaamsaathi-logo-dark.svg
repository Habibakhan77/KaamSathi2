<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ksDarkIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#148045" />
      <stop offset="50%" stop-color="#0A5C2E" />
      <stop offset="100%" stop-color="#053C1D" />
    </linearGradient>
  </defs>

  <!-- Group: Rounded Green Icon (unchanged brand mark) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="140" height="140" rx="35" fill="url(#ksDarkIconGrad)" />
    
    <!-- House Roof -->
    <path d="M 28 68 L 70 34 L 112 68" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- House Side Walls -->
    <path d="M 36 68 L 36 94" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <path d="M 104 68 L 104 94" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />

    <!-- 4-Pane Window (2x2) -->
    <rect x="52" y="69" width="14" height="14" rx="2.5" fill="#FFFFFF" />
    <rect x="74" y="69" width="14" height="14" rx="2.5" fill="#FFFFFF" />
    <rect x="52" y="90" width="14" height="14" rx="2.5" fill="#FFFFFF" />
    <rect x="74" y="90" width="14" height="14" rx="2.5" fill="#FFFFFF" />

    <!-- Dynamic Flowing Curve -->
    <path d="M 14 108 C 45 94, 68 102, 94 98 C 110 95, 122 84, 130 72" 
          stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" fill="none" />
  </g>

  <!-- Wordmark: "Kaam" in White #F2F7F4, "Saathi" in High-Contrast Green #1EB55E -->
  <text x="175" y="104" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="78" letter-spacing="-1.5">
    <tspan fill="#F2F7F4">Kaam</tspan><tspan fill="#1EB55E">Saathi</tspan>
  </text>
</svg>
