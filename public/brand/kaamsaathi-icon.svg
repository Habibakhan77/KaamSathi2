<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ksIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6B37" />
      <stop offset="50%" stop-color="#0A5C2E" />
      <stop offset="100%" stop-color="#053C1D" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Background -->
  <rect x="8" y="8" width="184" height="184" rx="46" fill="url(#ksIconGrad)" />
  
  <!-- House Outline (Thick white stroke) -->
  <!-- Roof and walls with roof overhang -->
  <path d="M 46 95 L 46 125 M 154 95 L 154 125" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />
  <!-- Roof: Overhangs from 34,95 to peak 100,45 to 166,95 -->
  <path d="M 36 94 L 100 44 L 164 94" stroke="#FFFFFF" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- House Side Walls (below eaves) -->
  <path d="M 48 94 L 48 128" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  <path d="M 152 94 L 152 128" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

  <!-- Four-pane window (2x2 rounded squares) -->
  <rect x="74" y="94" width="20" height="20" rx="3.5" fill="#FFFFFF" />
  <rect x="106" y="94" width="20" height="20" rx="3.5" fill="#FFFFFF" />
  <rect x="74" y="124" width="20" height="20" rx="3.5" fill="#FFFFFF" />
  <rect x="106" y="124" width="20" height="20" rx="3.5" fill="#FFFFFF" />

  <!-- White swooping curve flowing from bottom-left up across bottom-right -->
  <path d="M 22 148 C 65 130, 95 140, 130 134 C 152 130, 168 116, 178 100" 
        stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" />
</svg>
